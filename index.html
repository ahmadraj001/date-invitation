<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Little Question ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Floating Hearts -->
    <div class="hearts"></div>

    <!-- Main Card -->
    <main class="card">

        <div class="heart-icon">❤️</div>

        <p class="small-text">I have a little question for you...</p>

        <h1>So… when are we making this date official? 👀❤️</h1>

        <p class="message">
            Just you, me, and a little bit of magic (MY_HEART). ✨
        </p>

        <div class="buttons">

            <button id="yesBtn" class="btn yes-btn">
                Yes ❤️
            </button>

            <button id="noBtn" class="btn no-btn">
                No 🙈
            </button>

        </div>

        <p id="hint" class="hint">
            Choose wisely... 😏
        </p>

    </main>


  <!-- Date Selection Popup -->
<div id="success" class="success-overlay">

    <div class="success-box">

        <div class="big-heart">💖</div>

        <h2>Yay! 🥰</h2>

        <p>I knew you'd say yes! ❤️</p>

        <p class="date-message">
            Now choose when we should make it happen! ✨
        </p>

        <div class="date-form">

            <label for="dateInput">
                📅 Pick a Date
            </label>

            <input type="date" id="dateInput">

            <label for="timeInput">
                🕐 Pick a Time
            </label>

            <input type="time" id="timeInput">

            <button id="confirmBtn" class="close-btn">
                Confirm Date 💕
            </button>

            <p id="formMessage" class="form-message"></p>

        </div>

    </div>

</div>


    <script src="script.js"></script>

</body>
</html>
